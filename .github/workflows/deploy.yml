name: Deploy to GitHub Pages

# 推到 master 即构建并部署到 GitHub Pages；PR 只做构建校验（不部署）；也可手动触发。
#
# 用 master：本仓库的默认分支是 master（master 与 dev 始终同点，内容无差异），
# 且 `github-pages` 环境的部署分支白名单已放行 master。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: false

# ICE 家族是三个**并列仓库**（不是 monorepo）：
# 应用在构建期把 ice-render / ice-web-components / ice-chart 通过 webpack alias 指到**同级目录**，
# 且三个家族包的产物都把 ice-render 保持为 external（由宿主提供同一份引擎实例）。
# 所以 CI 必须把它们签成「兄弟目录」，并按依赖顺序各自构建（ice-render 最先）。
#
# 与 ice-smart-water 的差异：本仓只消费 3 个家族包（不含 ice-entity-designer）。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签出应用（ice-game）
        uses: actions/checkout@v4
        with:
          path: ice-game

      - name: 签出家族依赖（引擎 + 控件 + 图表）
        uses: actions/checkout@v4
        with:
          repository: ice-render/ice-render
          ref: master
          path: ice-render
      - uses: actions/checkout@v4
        with:
          repository: ice-render/ice-web-components
          ref: main
          path: ice-web-components
      - uses: actions/checkout@v4
        with:
          repository: ice-render/ice-chart
          ref: main
          path: ice-chart

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: 构建家族依赖（ice-render 最先，再控件与图表）
        run: |
          set -e
          for d in ice-render ice-web-components ice-chart; do
            echo "::group::build $d"
            (cd "$d" && npm ci && npm run build)
            echo "::endgroup::"
          done

      - name: 安装并构建应用
        run: |
          cd ice-game
          npm ci
          # 不设置 ICE_GAME_SITE_URL：SEO 的 canonical/og:url/sitemap 需要绝对域名，
          # 没配就省略；webpack publicPath:'' 让所有资源走相对路径，
          # 因此在 GitHub Pages 的 /ice-game/ 子路径下也能正确加载。
          # 将来有对外域名时，在本步骤前加一句：
          #   echo "ICE_GAME_SITE_URL=https://ice-render.github.io/ice-game" >> "$GITHUB_ENV"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ice-game/dist

  deploy:
    needs: build
    # 只在 master（默认分支，github-pages 环境白名单已放行）上部署；PR 只构建校验
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
