<!DOCTYPE html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>ICE Game — 画布游戏厅</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='22 22 84 84'><path d='M79 44 L79 98 L101 82 L101 28 Z' fill='%2379d0ec' stroke='%2336b0d4' stroke-width='3' stroke-linejoin='round'/><path d='M27 44 L79 44 L79 98 L27 98 Z' fill='%23a6e3f5' stroke='%2336b0d4' stroke-width='3' stroke-linejoin='round'/><path d='M27 44 L79 44 L101 28 L49 28 Z' fill='%23e6fbff' stroke='%2336b0d4' stroke-width='3' stroke-linejoin='round'/></svg>"
  />
  <style>
    /*
      首页是**唯一允许纵向滚动**的页面：它要把几十张卡片加页脚铺完，
      画布高度由内容算出来（见 src/home/main.ts 的 measureCanvasHeight）。
      游戏页则相反 —— 固定画布 + 居中裁切，因为游戏版面不该跟着窗口重排。

      ## 三块画布，三种角色（z 从下到上）

        #bg       position: fixed，视口大小 —— **会动的那一层**（网格 / 粒子 / 光斑）。
                  每帧重绘，所以必须小、也必须与静态内容分开，否则等于每帧重画整页。
        #canvas   static，内容高度 —— 卡片与文字。**静态**：只在交互时重绘。
        #navbar   position: fixed，条状 —— 吸顶导航，独立 ICE 实例。

      副作用很好看：#bg 是 fixed 而 #canvas 会滚动，于是滚动时"星星在玻璃后面不动、
      内容从前面滑过"，视差感是白来的。

      三块都是固定宽度 1180 且水平居中，所以左右对齐、看起来是一个整体版面；
      也因此不需要响应式重排（本仓其它页面同样是"固定设计尺寸、窗口小了裁切"）。
    */
    :root {
      /*
        导航高度：**由 JS 写入**（`src/home/main.ts` 会 setProperty 覆盖这里）。
        这里给的值只是 JS 执行前的兜底 —— 真相只有一份，在 `src/home/navbar.ts` 的
        `NAVBAR.height`，避免 CSS 与代码各写一个数字后悄悄错位。
      */
      --navbar-height: 64px;
      --canvas-width: 1180px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 顶部留出吸顶导航的位置，否则 hero 会被导航压住 */
      padding: calc(var(--navbar-height) + 20px) 0 40px;
      /*
        最底层只有一个深色径向渐变。**网格与粒子已经移到 `#bg` 画布上**
        （见 src/home/effects-canvas.ts）：用画布画才能动（网格呼吸、粒子漂移），
        而且整页的视觉因此都来自引擎，不再依赖 CSS 效果。
      */
      background-color: #080a0f;
      background-image: radial-gradient(circle at 50% 12%, #1b2130 0%, #080a0f 62%);
      background-attachment: fixed;
    }

    /*
      效果层：铺满视口、水平居中、在最底下。
      `pointer-events: none` —— 它只是氛围，绝不能挡住内容的点击。
    */
    #bg {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--canvas-width);
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    #canvas {
      display: block;
      position: relative;
      z-index: 1;
      border-radius: 14px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    }

    #navbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--canvas-width);
      /* 盖在内容之上：页面内容会从它下面滚过 */
      z-index: 100;
      display: block;
    }
  </style>
  <body>
    <!-- 效果层（粒子 / 网格 / 光斑）：内容由 src/home/effects-canvas.ts 绘制 -->
    <canvas id="bg" width="1180" height="900"></canvas>

    <!-- 吸顶导航：独立画布，内容由 src/home/navbar.ts 绘制 -->
    <canvas id="navbar" width="1180" height="64"></canvas>

    <!-- 页面主体：宽高都由 main.ts 按目录内容算出后设置，这里的值只是初始占位 -->
    <canvas id="canvas" width="1180" height="660"></canvas>
  </body>
</html>
