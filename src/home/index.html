<!DOCTYPE html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>ICE Game — 画布游戏厅</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d6efd'/><path d='M12 9l12 7-12 7z' fill='%23ffffff'/></svg>"
  />
  <style>
    /*
      首页是**唯一允许纵向滚动**的页面：它要把几十张卡片加页脚铺完，
      画布高度由内容算出来（见 src/home/main.ts 的 measureCanvasHeight）。
      游戏页则相反 —— 固定画布 + 居中裁切，因为游戏版面不该跟着窗口重排。

      页面结构是**两块画布**：
        #navbar —— 吸顶导航（CSS fixed，独立 ICE 实例，见 src/home/navbar.ts）
        #canvas —— 页面主体（随窗口滚动）

      两块都固定宽度 1180 并水平居中，所以左右对齐、看起来是一个整体版面；
      也因此不需要响应式重排（本仓其它页面同样是"固定设计尺寸、窗口小了裁切"）。
    */
    :root {
      /* 与 src/home/navbar.ts 的 NAVBAR.height 保持一致（改一处要同步另一处） */
      --navbar-height: 60px;
      --canvas-width: 1180px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 顶部留出吸顶导航的位置，否则 hero 会被导航压住 */
      padding: calc(var(--navbar-height) + 20px) 0 40px;
      background: radial-gradient(circle at 50% 12%, #1b2130 0%, #080a0f 60%);
    }

    /*
      吸顶导航：`position: fixed` 让它永远可见、**不随窗口滚动**。
      宽度固定 + 居中，与页面主体左右对齐。
      圆角与阴影由画布内部自己画（见 navbar.ts），所以这里不给 canvas 加边框圆角。
    */
    #navbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--canvas-width);
      /* 盖在页面主体之上：页面内容会从它下面滚过 */
      z-index: 100;
      display: block;
    }

    #canvas {
      display: block;
      border-radius: 14px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    }
  </style>
  <body>
    <!-- 吸顶导航：独立画布，内容由 src/home/navbar.ts 绘制 -->
    <canvas id="navbar" width="1180" height="60"></canvas>

    <!-- 页面主体：宽高都由 main.ts 按目录内容算出后设置，这里的值只是初始占位 -->
    <canvas id="canvas" width="1180" height="660"></canvas>
  </body>
</html>
